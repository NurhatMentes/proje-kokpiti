<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proje Kokpiti</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icon.svg" alt="" width="28" height="28" />
      <div>
        <h1>Proje Kokpiti</h1>
        <p id="scanInfo" class="muted">Taranıyor…</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="refreshBtn" class="btn" title="Tüm klasörleri yeniden tara">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" /></svg>
        <span>Yenile</span>
      </button>
      <button id="settingsBtn" class="btn ghost" title="Ayarlar" aria-label="Ayarlar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" /></svg>
      </button>
    </div>
  </header>

  <main>
    <section id="stats" class="stats" aria-label="Özet"></section>

    <section class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
        <input id="search" type="search" placeholder="Proje ya da teknoloji ara…  ( / )" autocomplete="off" />
      </div>
      <div id="statusFilters" class="chips" role="tablist"></div>
      <div class="toolbar-right">
        <label class="toggle"><input id="onlyIssues" type="checkbox" /> <span>Sadece uyarılı</span></label>
        <select id="sort" aria-label="Sıralama">
          <option value="recent">Son değişiklik</option>
          <option value="name">İsim</option>
          <option value="issues">Uyarı sayısı</option>
          <option value="changes">Commit bekleyen</option>
        </select>
      </div>
    </section>

    <section id="grid" class="grid" aria-live="polite">
      <div class="loading"><span class="spinner"></span> Projeler taranıyor…</div>
    </section>
  </main>

  <div id="scrim" class="scrim" hidden></div>
  <aside id="drawer" class="drawer" aria-hidden="true" tabindex="-1"></aside>

  <dialog id="settings" class="dialog">
    <form method="dialog" id="settingsForm">
      <h2>Ayarlar</h2>
      <label>
        <span>Taranacak klasörler <small class="muted">(her satıra bir tane)</small></span>
        <textarea id="rootsInput" rows="4" spellcheck="false"></textarea>
      </label>
      <label>
        <span>"Uzun süredir dokunulmadı" uyarısı <small class="muted">(gün)</small></span>
        <input id="staleInput" type="number" min="7" max="3650" />
      </label>
      <label>
        <span>AI özeti modeli <small class="muted">(OpenRouter model adı)</small></span>
        <input id="modelInput" list="modelList" spellcheck="false" placeholder="anthropic/claude-sonnet-5" />
        <datalist id="modelList">
          <option value="anthropic/claude-sonnet-5">Dengeli: kaliteli ve uygun fiyatlı</option>
          <option value="anthropic/claude-opus-5.5">En iyi kalite</option>
          <option value="anthropic/claude-haiku-latest">Hızlı ve ucuz</option>
          <option value="deepseek/deepseek-v4-flash">Çok ucuz</option>
          <option value="qwen/qwen3.8-27b:free">Ücretsiz</option>
        </datalist>
        <small id="keyStatus" class="muted"></small>
      </label>
      <p id="settingsError" class="error" hidden></p>
      <div class="dialog-actions">
        <button value="cancel" class="btn ghost" formnovalidate>Vazgeç</button>
        <button id="saveSettings" value="default" class="btn primary">Kaydet ve tara</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="app.js" type="module"></script>
</body>
</html>
